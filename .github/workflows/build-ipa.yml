name: Build iCSM IPA (A11‑iOS16)
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App Bundle ID (your signing tool can change it later)
        required: true
        default: com.icsm.client
        type: string
      jobs:
        description: Parallel compiler jobs (2 recommended for the standard runner)
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3']
permissions:
  contents: read
concurrency:
  group: icsm-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      ICSM_BUNDLE_ID: ${{ inputs.bundle_id }}
      ICSM_BUILD_JOBS: ${{ inputs.jobs }}
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Patch icsm.py: override hard‑coded deployment target 27.0 → 16.0
        run: |
          set -o pipefail
          # 替换脚本内硬编码的 CMAKE_OSX_DEPLOYMENT_TARGET
          sed -i '' 's/-DCMAKE_OSX_DEPLOYMENT_TARGET=27.0/-DCMAKE_OSX_DEPLOYMENT_TARGET=16.0/g' icsm.py
          echo "=== Verify patch result ==="
          grep "CMAKE_OSX_DEPLOYMENT_TARGET" icsm.py
          echo "=========================="

      - name: Check Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          df -h .

      - name: Compile native modules and export IPA
        run: |
          set -o pipefail
          mkdir -p Build
          ./icsm build --unsigned --bundle-id "$ICSM_BUNDLE_ID" --jobs "$ICSM_BUILD_JOBS" 2>&1 | tee Build/cloud-build.log

      - name: Verify iOS deployment target (vtool binary check, no Info.plist dependency)
        run: |
          unzip -q -o Build/iCSM-unsigned.ipa -d Build/ipa-tmp
          # 精准取 Payload 下一级的 .app
          MAIN_APP=$(find Build/ipa-tmp/Payload -maxdepth 1 -type d -name "*.app" | head -n1)
          APP_BINARY="$MAIN_APP/$(basename "$MAIN_APP" .app)"

          echo "Main app binary: $APP_BINARY"
          # 读取mach‑o里的minos最低iOS版本
          MIN_VER=$(xcrun vtool -show-build "$APP_BINARY" | grep -m1 "minos" | awk '{print $2}')
          echo "Binary minimum iOS version: $MIN_VER"

          # 允许 ≤16.0
          if printf '%s\n' "16.0" "$MIN_VER" | sort -V | head -n1 | grep -q "16.0"; then
            echo "✅ Deployment target OK (≤16.0)"
          else
            echo "::error::Deployment target too high! Expected ≤16.0, got $MIN_VER"
            exit 1
          fi

          rm -rf Build/ipa-tmp

      - name: Verify app and all 35 frameworks
        run: |
          python3 scripts/verify_ipa.py Build/iCSM-unsigned.ipa --unsigned --report Build/ipa-report.json
          (
            cd Build
            shasum -a 256 iCSM-unsigned.ipa > SHA256SUMS.txt
          )
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## iCSM IPA ready (A11‑iOS16 build)
          Download **iCSM‑IPA** under **Artifacts** below and extract it.
          Re‑sign **iCSM‑unsigned.ipa** with your own Apple account before installing.

          ⚠️ Important for A11 (iPhone X / 8 /8 Plus):
          - This build sets minimum iOS 16.0, but **A11 hardware does NOT support MetalFX**.
          - You MUST modify source code to remove MTLFX calls, otherwise app will crash on launch.
          - iPhone8/8P (2GB RAM) is high risk for memory‑kill; iPhone X (3GB) works better.

          No Apple account, certificate, device ID or game data is uploaded to the build runner.
          See **docs/CLOUD_BUILD.en.md** for Windows installation and data import.
          TEXT
          cat Build/ipa-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iCSM-IPA-A11-iOS16
          path: |
            Build/iCSM-unsigned.ipa
            Build/iCSM.entitlements
            Build/ipa-report.json
            Build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iCSM-build-log
          path: Build/cloud-build.log
          if-no-files-found: ignore
          retention-days: 7

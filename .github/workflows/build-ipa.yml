name: Build iCSM IPA (A11 / iOS 16)
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App Bundle ID (your signing tool can change it later)
        required: true
        default: com.icsm.client
        type: string
      jobs:
        description: Parallel compiler jobs (2 recommended for the standard runner)
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3']
permissions:
  contents: read
concurrency:
  group: icsm-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      ICSM_BUNDLE_ID: ${{ inputs.bundle_id }}
      ICSM_BUILD_JOBS: ${{ inputs.jobs }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Patch icsm.py & verify_ipa.py for iOS 16 deployment
        run: |
          set -o pipefail
          # 1. Override deployment target 27.0 -> 16.0
          sed -i '' 's/-DCMAKE_OSX_DEPLOYMENT_TARGET=27.0/-DCMAKE_OSX_DEPLOYMENT_TARGET=16.0/g' icsm.py
          # 2. Disable mandatory iPhoneOS 27.x SDK check in icsm.py
          sed -i '' "s/if '27.' not in output(\['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'\]):/if False: # skipped SDK check/g" icsm.py
          # 3. 屏蔽 verify_ipa.py 的 MinimumOSVersion >=27 校验
          sed -i '' 's/require(float(info\['\''MinimumOSVersion'\'']) >= 27, '\''Incorrect deployment target'\'')/# require(float(info['\''MinimumOSVersion'\'']) >= 27, '\''Incorrect deployment target'\'') # patched for iOS16/g' scripts/verify_ipa.py
          echo "=== Patch verification ==="
          echo "Deployment target in icsm.py:"
          grep -o "CMAKE_OSX_DEPLOYMENT_TARGET=.*" icsm.py || true
          echo ""
          echo "SDK check line in icsm.py:"
          grep -n "skipped SDK check" icsm.py || true
          echo ""
          echo "verify_ipa.py patched line:"
          grep -n "patched for iOS16" scripts/verify_ipa.py || true
          echo "=========================="

      # ========== 修复版：禁用 MetalFX 修复 A11 启动闪退 ==========
      - name: Patch source to disable MetalFX (fix A11 launch crash)
        run: |
          set -o pipefail
          # Force C locale to fix BSD sed illegal byte sequence error
          export LC_ALL=C

          # 1. Global disable MetalFX main switch
          find Sources -type f \( -name "*.mm" -o -name "*.m" -o -name "*.h" \) \
            -exec sed -i '' 's/useMetalFX = YES/useMetalFX = NO/g' {} +

          # 2. Comment out MetalFX spatial scaler initialization
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#\[self setupMetalFXRuntime\]#//[self setupMetalFXRuntime] /* A11 compat disabled */#g' {} +

          # 3. Comment out MetalFX frame interpolation initialization
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#\[self setupFrameInterpolation\]#//[self setupFrameInterpolation] /* A11 compat disabled */#g' {} +

          # 4. Comment out MTLFXSpatialScaler instantiation
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#MTLFXSpatialScaler alloc#//MTLFXSpatialScaler alloc /* A11 compat disabled */#g' {} +

          # Verify patch result
          echo "=== MetalFX patch verification ==="
          echo "Uncommented setupMetalFXRuntime calls:"
          grep -rn "setupMetalFXRuntime" Sources --include="*.m" --include="*.mm" | grep -v "//" || echo "None ✅"
          echo ""
          echo "Remaining useMetalFX = YES:"
          grep -rn "useMetalFX = YES" Sources --include="*.m" --include="*.mm" --include="*.h" || echo "None ✅"
          echo ""
          echo "Uncommented MTLFXSpatialScaler calls:"
          grep -rn "MTLFXSpatialScaler" Sources --include="*.m" --include="*.mm" | grep -v "//" || echo "None ✅"
          echo "==================================="
      # ========================================================

      # ========== 新增：Metal shader 语言版本降到 2.4（A11 / iOS 16） ==========
      - name: Patch Metal language version to 2.4 (fix A11 shader compile crash)
        run: |
          set -o pipefail
          export LC_ALL=C
          # A11 GPU (iPhone X / 8 / 8 Plus) supports Metal Shading Language up to 2.4.
          # The port hardcodes MTLLanguageVersion3_2 for runtime shader compilation,
          # which fails on A11 and crashes the app at launch.
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/MTLLanguageVersion3_2/MTLLanguageVersion2_4/g' {} +
          echo "=== Metal language version patch verification ==="
          grep -rn "MTLLanguageVersion" Sources --include="*.mm" --include="*.inc" | grep -v "MTLLanguageVersion2_4" || echo "All runtime shader compiles use 2_4 OK"
          echo "==================================================="
      # ========================================================

      # ========== 新增：iOS 17 专属 UIKit API 降级兼容（A11 / iOS 16） ==========
      - name: Patch iOS 17-only UIKit APIs for iOS 16 (effectiveGeometry)
        run: |
          set -o pipefail
          export LC_ALL=C
          # UIWindowScene.effectiveGeometry is iOS 17+; iPhone X runs iOS 16 and
          # crashes with "unrecognized selector" at launch.
          # 1. Size sampling -> scene.screen.bounds (iOS 13+)
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.coordinateSpace\.bounds\.size/scene.screen.bounds.size/g' {} +
          # 2. Interactive resize probe -> always false on iOS 16
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/window\.windowScene\.effectiveGeometry\.isInteractivelyResizing/false/g' {} +
          # 3. Window-scene orientation -> UIDevice orientation (same raw values)
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/window\.windowScene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          # 4. Scene orientation lock -> NO
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.interfaceOrientationLocked/NO/g' {} +
          # 5. Scene orientation -> UIDevice orientation
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          echo "=== iOS 17 API patch verification ==="
          grep -rn "effectiveGeometry" Sources --include="*.mm" --include="*.inc" | grep -v "//" || echo "No effectiveGeometry remaining OK"
          echo "=============================================="
      # ========================================================

      - name: Check Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          df -h .
      - name: Compile native modules and export IPA
        run: |
          set -o pipefail
          mkdir -p Build
          ./icsm build --unsigned --bundle-id "$ICSM_BUNDLE_ID" --jobs "$ICSM_BUILD_JOBS" 2>&1 | tee Build/cloud-build.log
      - name: Verify iOS minimum version (vtool binary check)
        run: |
          unzip -q -o Build/iCSM-unsigned.ipa -d Build/ipa-tmp
          MAIN_APP=$(find Build/ipa-tmp/Payload -maxdepth 1 -type d -name "*.app" | head -n 1)
          APP_BINARY="$MAIN_APP/$(basename "$MAIN_APP" .app)"
          
          echo "App binary path: $APP_BINARY"
          MIN_VER=$(xcrun vtool -show-build "$APP_BINARY" | grep -m 1 "minos" | awk '{print $2}')
          echo "Binary minimum iOS version: $MIN_VER"
          
          if printf '%s\n' "16.0" "$MIN_VER" | sort -V | head -n 1 | grep -q "16.0"; then
            echo "✅ Deployment target meets iOS 16 requirement"
          else
            echo "::error::Deployment target too high! Expected ≤ 16.0, got $MIN_VER"
            exit 1
          fi
          
          rm -rf Build/ipa-tmp
      - name: Verify app and all 35 frameworks
        run: |
          python3 scripts/verify_ipa.py Build/iCSM-unsigned.ipa --unsigned --report Build/ipa-report.json
          (
            cd Build
            shasum -a 256 iCSM-unsigned.ipa > SHA256SUMS.txt
          )
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## iCSM IPA ready (A11 / iOS 16 build)
          Download **iCSM-IPA-A11-iOS16** under **Artifacts** below and extract it.
          Re-sign **iCSM-unsigned.ipa** with your own Apple account before installing.
          ⚠️ A11 device notice (iPhone X / 8 / 8 Plus)
          - MetalFX has been disabled in this build to fix launch crash on A11 chip.
          - Metal shader language version has been downgraded to 2.4 for A11 compatibility.
          - iPhone 8 / 8 Plus (2GB RAM) has high risk of being killed due to memory limit; iPhone X (3GB) performs better.
          No Apple account, certificate, device ID or game data is uploaded to the build runner.
          See **docs/CLOUD_BUILD.en.md** for Windows installation and data import.
          TEXT
          cat Build/ipa-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA and verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iCSM-IPA-A11-iOS16
          path: |
            Build/iCSM-unsigned.ipa
            Build/iCSM.entitlements
            Build/ipa-report.json
            Build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iCSM-build-log
          path: Build/cloud-build.log
          if-no-files-found: ignore
          retention-days: 7

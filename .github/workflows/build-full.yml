name: Build iCSM IPA + Data

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App Bundle ID (your signing tool can change it later)
        required: true
        default: com.icsm.client
        type: string
      jobs:
        description: Native compiler jobs (2 recommended)
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3']
      data_repository:
        description: GitHub repository holding the resource input release
        required: true
        default: zktfjcksxk-spec/iCSM
        type: string

permissions:
  contents: read

concurrency:
  group: icsm-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      ICSM_BUNDLE_ID: ${{ inputs.bundle_id }}
      ICSM_BUILD_JOBS: ${{ inputs.jobs }}
    steps:
      - name: Check out mobile source and MSL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Patch sources for iOS 16 / A11 compatibility
        run: |
          set -o pipefail
          export LC_ALL=C
          # 1. icsm.py: deployment target 27.0 -> 16.0 + skip mandatory SDK 27 check
          sed -i '' 's/-DCMAKE_OSX_DEPLOYMENT_TARGET=27.0/-DCMAKE_OSX_DEPLOYMENT_TARGET=16.0/g' icsm.py
          sed -i '' "s/if '27.' not in output(\['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'\]):/if False: # skipped SDK check/g" icsm.py
          # 2. verify_ipa.py: skip MinimumOSVersion >= 27 check
          sed -i '' 's/require(float(info\['\''MinimumOSVersion'\'']) >= 27, '\''Incorrect deployment target'\'')/# require(float(info['\''MinimumOSVersion'\'']) >= 27, '\''Incorrect deployment target'\'') # patched for iOS16/g' scripts/verify_ipa.py
          # 3. build_data.py: skip iPhoneOS 27.x SDK requirement (A11 uses iOS 16)
          sed -i '' "s/require(sdk_version.split('\.')\[0\] == '27', 'This mobile release requires the iPhoneOS 27\.x SDK')/require(True, 'SDK check skipped for iOS16')/g" scripts/build_data.py
          # 4. Data/shaders.json: compile Metal for iOS 16, language 3.2 -> 2.4.
          #    CLI -std needs the platform prefix (ios-metal2.4); bare metal2.4 is invalid.
          sed -i '' 's/air64-apple-ios27\.0/air64-apple-ios16.0/g' Data/shaders.json
          sed -i '' 's/-std=metal3\.2/-std=ios-metal2.4/g' Data/shaders.json
          # 5. Disable MetalFX (A11 chip does not support MetalFX)
          find Sources -type f \( -name "*.mm" -o -name "*.m" -o -name "*.h" \) \
            -exec sed -i '' 's/useMetalFX = YES/useMetalFX = NO/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#\[self setupMetalFXRuntime\]#//[self setupMetalFXRuntime] /* A11 compat disabled */#g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#\[self setupFrameInterpolation\]#//[self setupFrameInterpolation] /* A11 compat disabled */#g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.m" \) \
            -exec sed -i '' 's#MTLFXSpatialScaler alloc#//MTLFXSpatialScaler alloc /* A11 compat disabled */#g' {} +
          # 6. Runtime shader language version 3.2 -> 2.4
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/MTLLanguageVersion3_2/MTLLanguageVersion2_4/g' {} +
          # 7. iOS 17-only UIWindowScene.effectiveGeometry -> iOS 16 equivalents
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.coordinateSpace\.bounds\.size/scene.screen.bounds.size/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/view\.window\.windowScene\.effectiveGeometry\.isInteractivelyResizing/false/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/v\.window\.windowScene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/view\.window\.windowScene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/window\.windowScene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.interfaceOrientationLocked/NO/g' {} +
          find Sources -type f \( -name "*.mm" -o -name "*.inc" \) \
            -exec sed -i '' 's/scene\.effectiveGeometry\.interfaceOrientation/(UIInterfaceOrientation)UIDevice.currentDevice.orientation/g' {} +
          echo "=== Full build iOS16 patch verification ==="
          echo "Deployment target:"
          grep -o "CMAKE_OSX_DEPLOYMENT_TARGET=.*" icsm.py || true
          echo "SDK check skipped:"
          grep -n "skipped SDK check" icsm.py scripts/build_data.py || true
          echo "verify_ipa patched:"
          grep -n "patched for iOS16" scripts/verify_ipa.py || true
          echo "shader target/options:"
          grep -n "air64-apple-ios\|std=metal" Data/shaders.json || true
          echo "effectiveGeometry remaining (comments only ok):"
          grep -rn "effectiveGeometry" Sources --include="*.mm" --include="*.inc" | grep -v "//" || echo "No effectiveGeometry remaining OK"
          echo "=================================================="

      # ========== 修复版：TouchController 硬链接改弱链接（iOS 26+ 私有框架，iOS16 缺失导致 dlopen launcher.framework 失败） ==========
      - name: Patch TouchController to weak link (fix launcher dlopen on iOS 16)
        run: |
          set -o pipefail
          export LC_ALL=C
          # SDL2-2.0.framework hard-links TouchController (iOS 26+ private framework).
          # On iOS 16 TouchController is absent -> dyld cannot load launcher.framework
          # -> "游戏启动失败 / 资源加载未完成". Weak link makes dyld ignore the missing
          # framework; the runtime [TCTouchController isSupported] nil-message guard
          # disables the touch-controller feature safely (no code change needed).
          perl -0pi -e 's/"-framework",\n\s*"TouchController",/"-weak_framework",\n        "TouchController",/g' native-build-plan.json
          echo "=== TouchController weak-link patch verification ==="
          echo "Context before 'TouchController':"
          grep -n -B1 '"TouchController"' native-build-plan.json | head -n 6
          echo "Hard link remaining check:"
          if grep -n -A1 '"-framework",' native-build-plan.json | grep -q '"TouchController"'; then
            echo "FAIL: hard -framework TouchController still present"
            exit 1
          else
            echo "OK: TouchController is now weak-linked"
          fi
          echo "=================================================="

      # ========== 修复版：source_metal 硬链接 MetalFX 改弱链接（MTLFXFrameInterpolatorDescriptor 是 iOS 17+ 类，iOS16 的 MetalFX.framework 无此符号 -> launcher dlopen 失败） ==========
      - name: Patch source_metal to weak-link MetalFX (fix MTLFXFrameInterpolatorDescriptor symbol on iOS 16)
        run: |
          set -o pipefail
          export LC_ALL=C
          # source_metal.framework 链接了 MTLFXFrameInterpolatorDescriptor（iOS 17+ 类）。
          # iOS 16 的 MetalFX.framework 存在但不含该符号 -> 硬链接使 dlopen 符号解析失败
          # -> "游戏启动失败 / 资源加载未完成". 弱链接后符号缺失不阻止加载；
          # MetalFX 调用已在源码禁用（useMetalFX = NO），不会触发空符号，安全。
          perl -0pi -e 's/"-framework",\n\s*"MetalFX"/"-weak_framework",\n        "MetalFX"/g' native-build-plan.json
          echo "=== MetalFX weak-link patch verification ==="
          echo "Context before 'MetalFX':"
          grep -n -B1 '"MetalFX"' native-build-plan.json | head -n 6
          echo "Hard link remaining check:"
          if grep -n -A1 '"-framework",' native-build-plan.json | grep -q '"MetalFX"'; then
            echo "FAIL: hard -framework MetalFX still present"
            exit 1
          else
            echo "OK: MetalFX is now weak-linked"
          fi
          echo "=================================================="

      # ========== 修复版：UICornerConfiguration 等 iOS 17+ corner API 降级为 CALayer（iOS 16 无 UICornerConfiguration/UICornerRadius/effectiveRadiusForCorner，SDL2 二进制因此符号缺失 -> launcher dlopen 失败） ==========
      - name: Patch UICornerConfiguration iOS 17+ corner APIs to CALayer (iOS 16 compat)
        run: |
          set -o pipefail
          export LC_ALL=C
          # iCSM touch UI 使用 iOS 17+ 的 corner 体系（UICornerConfiguration / UICornerRadius /
          # UIView.cornerConfiguration / effectiveRadiusForCorner），iOS 16 无这些符号，
          # 且代码被编入 SDL2-2.0.framework -> dlopen launcher 时 Symbol not found。
          # 降级为 CALayer.cornerRadius / cornerCurve（iOS 13+ 可用），圆角效果保留。
          for f in Sources/workspace/ipados-arm64/touch/translucent_surface_ios.inc \
                   Sources/workspace/ipados-arm64/touch/glass_navigation_ios.inc \
                   Sources/workspace/ipados-arm64/touch/console_header_ios.inc; do
            sed -i '' \
              -e 's/self\.blurView\.cornerConfiguration=self\.cornerConfiguration/self.blurView.layer.cornerRadius=self.layer.cornerRadius/g' \
              -e 's/\[\([A-Za-z0-9_.]*\) effectiveRadiusForCorner:UIRectCorner\(TopLeft\|AllCorners\)\]/\1.layer.cornerRadius/g' \
              -e 's/UICornerConfiguration \*corners=\[UICornerConfiguration configurationWithUniformRadius:\[UICornerRadius fixedRadius:\([0-9A-Za-z_]*\)\]\]/CGFloat corners=\1/g' \
              -e 's/glass\.cornerConfiguration=corners/glass.layer.cornerRadius=corners/g' \
              -e 's/\.cornerConfiguration=\[UICornerConfiguration configurationWithUniformRadius:\[UICornerRadius fixedRadius:\([0-9A-Za-z_]*\)\]\]/.layer.cornerRadius=\1/g' \
              -e 's/\.cornerConfiguration=\[UICornerConfiguration configurationWithUniformRadius:\[UICornerRadius containerConcentricRadius\]\]/.layer.cornerRadius=8/g' \
              -e 's/\.cornerConfiguration=UICornerConfiguration\.capsuleConfiguration/.layer.cornerRadius=16/g' \
              "$f"
          done
          echo "=== UICorner iOS17 corner API patch verification ==="
          grep -rn "UICornerConfiguration\|UICornerRadius\|effectiveRadiusForCorner\|cornerConfiguration" Sources/workspace/ipados-arm64/touch --include="*.inc" || echo "No iOS17 corner APIs remaining OK"
          echo "=================================================="

      # ========== 修复版：A11 指令集（ARMv8.1 原子指令 LDAPRB 在 A11 上 SIGILL） ==========
      # iOS 27 SDK 的 native-build-plan.json 全部 3796 条编译命令写死
      # -miphoneos-version-min=27.0，clang 据此生成 ARMv8.1+ 原子指令
      # （LDAPRB/STLR 等，std::atomic/mutex 常见）。A11（iPhone X, ARMv8.0）
      # 执行这些指令直接 SIGILL（EXC_BAD_INSTRUCTION）。
      # 崩溃点: tier0 LoggingSystem_RegisterLoggingChannel+48 处 ldaprb，
      # 发生于 engine dlopen 时 tier0 全局静态初始化（__GLOBAL__sub_I_dbg.cpp）。
      # 修复: 部署目标 27.0 -> 16.0 + 每条编译命令加 -mcpu=apple-a11，
      # 让 clang 生成 A11 恰好支持的指令集。
      - name: Patch native-build-plan for A11 instruction set (fix ldaprb SIGILL)
        run: |
          set -o pipefail
          export LC_ALL=C
          perl -0pi -e 's/"-miphoneos-version-min=27\.0",/"-miphoneos-version-min=16.0",/g' native-build-plan.json
          perl -0pi -e 's/"-arch",\n\s*"arm64",/"-arch",\n        "arm64",\n        "-mcpu=apple-a11",/g' native-build-plan.json
          echo "=== A11 instruction-set patch verification ==="
          echo "miphoneos-version-min=27.0 remaining (should be 0):"
          grep -c '"-miphoneos-version-min=27.0"' native-build-plan.json || echo "0 OK"
          echo "miphoneos-version-min=16.0 count:"
          grep -c '"-miphoneos-version-min=16.0"' native-build-plan.json
          echo "-mcpu=apple-a11 count (should equal 3796):"
          grep -c '"-mcpu=apple-a11"' native-build-plan.json
          echo "JSON validity:"
          python3 -c "import json; json.load(open('native-build-plan.json')); print('JSON OK')"
          echo "=================================================="

      # ========== 修复版 v2：text_provider/v8/engine 缺失 iOS16 POSIX 符号补丁 ==========
      # 启动报错: Symbol not found: _pipe2 (dlopen panoramauiclient 失败)
      # pipe2/strndup/vasprintf/stpcpy/getprogname/fnmatch/backtrace/posix_madvise
      # 是 macOS/Linux POSIX 符号，iOS 16 libSystem 没有。预编译的 GLib/Pango/V8
      # 静态库引用了它们 -> dlopen 时符号解析失败 -> "游戏启动失败/资源加载未完成"。
      # 用 stub 实现补齐，注入 text_provider / v8 / engine 三个 framework 的链接参数。
      - name: Patch missing POSIX symbols for iOS 16 (pipe2/strndup/vasprintf/...)
        run: |
          set -o pipefail
          export LC_ALL=C
          mkdir -p Build/native/i4/objects Build/native/i5/objects
          cat > Build/native/i4/objects/posix_stub.c <<'STUB_EOF'
          #include <stdarg.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/mman.h>

          /* pipe2: iOS libSystem 无此符号 (macOS/Linux POSIX). pipe + fcntl 实现 */
          int pipe2(int fds[2], int flags) {
              if (fds == 0) { errno = EFAULT; return -1; }
              if (pipe(fds) != 0) return -1;
              if (flags & O_CLOEXEC) {
                  if (fcntl(fds[0], F_SETFD, FD_CLOEXEC) < 0 || fcntl(fds[1], F_SETFD, FD_CLOEXEC) < 0) {
                      int e = errno; close(fds[0]); close(fds[1]); errno = e; return -1;
                  }
              }
              if (flags & O_NONBLOCK) {
                  int f0 = fcntl(fds[0], F_GETFL, 0), f1 = fcntl(fds[1], F_GETFL, 0);
                  if (f0 < 0 || f1 < 0) { int e = errno; close(fds[0]); close(fds[1]); errno = e; return -1; }
                  if (fcntl(fds[0], F_SETFL, f0 | O_NONBLOCK) < 0 || fcntl(fds[1], F_SETFL, f1 | O_NONBLOCK) < 0) {
                      int e = errno; close(fds[0]); close(fds[1]); errno = e; return -1;
                  }
              }
              return 0;
          }

          /* strndup: iOS 无此符号 */
          char *strndup(const char *s, size_t n) {
              if (s == 0) { errno = EINVAL; return 0; }
              size_t len = strnlen(s, n);
              char *p = (char *)malloc(len + 1);
              if (p == 0) { errno = ENOMEM; return 0; }
              memcpy(p, s, len);
              p[len] = '\0';
              return p;
          }

          /* stpcpy: 返回 dst+strlen(src) */
          char *stpcpy(char *dst, const char *src) {
              char *d = dst;
              if (dst == 0 || src == 0) return dst;
              while ((*d = *src) != '\0') { d++; src++; }
              return d;
          }

          /* vasprintf / vasprintf_l: iOS 无此符号 */
          int vasprintf(char **strp, const char *fmt, va_list ap) {
              if (strp == 0 || fmt == 0) { errno = EINVAL; return -1; }
              va_list ap2;
              va_copy(ap2, ap);
              int len = vsnprintf(0, 0, fmt, ap2);
              va_end(ap2);
              if (len < 0) return -1;
              char *buf = (char *)malloc((size_t)len + 1);
              if (buf == 0) { errno = ENOMEM; return -1; }
              va_copy(ap2, ap);
              vsnprintf(buf, (size_t)len + 1, fmt, ap2);
              va_end(ap2);
              *strp = buf;
              return len;
          }
          int vasprintf_l(char **strp, void *loc, const char *fmt, va_list ap) {
              (void)loc;
              return vasprintf(strp, fmt, ap);
          }

          /* getprogname: iOS 无此符号 (macOS 有) */
          const char *getprogname(void) {
              return "CSGOI5Client";
          }

          /* fnmatch 简化实现 (* ? [set]) */
          #define FNM_NOMATCH 1
          int fnmatch(const char *pattern, const char *string, int flags) {
              (void)flags;
              if (pattern == 0 || string == 0) return FNM_NOMATCH;
              const char *p = pattern, *s = string;
              while (*p) {
                  if (*p == '*') {
                      p++;
                      if (!*p) return 0;
                      while (*s) {
                          if (fnmatch(p, s, 0) == 0) return 0;
                          s++;
                      }
                      return FNM_NOMATCH;
                  } else if (*p == '?') {
                      if (!*s) return FNM_NOMATCH;
                      p++; s++;
                  } else if (*p == '[') {
                      if (!*s) return FNM_NOMATCH;
                      int neg = 0, match = 0;
                      p++;
                      if (*p == '!' || *p == '^') { neg = 1; p++; }
                      if (*p == ']') { if (*s == ']') match = 1; p++; }
                      while (*p && *p != ']') {
                          if (p[1] == '-' && p[2] && p[2] != ']') {
                              if (*s >= p[0] && *s <= p[2]) match = 1;
                              p += 3;
                          } else {
                              if (*s == p[0]) match = 1;
                              p++;
                          }
                      }
                      if (*p == ']') p++;
                      if (neg) match = !match;
                      if (!match) return FNM_NOMATCH;
                      s++;
                  } else {
                      if (*p != *s) return FNM_NOMATCH;
                      p++; s++;
                  }
              }
              return *s ? FNM_NOMATCH : 0;
          }

          /* backtrace / backtrace_symbols: iOS 无此符号 (macOS 有) */
          int backtrace(void **buffer, int size) {
              (void)buffer; (void)size;
              return 0;
          }
          char **backtrace_symbols(void *const *buffer, int size) {
              (void)buffer; (void)size;
              return 0;
          }

          /* posix_madvise: 转调 madvise */
          int posix_madvise(void *addr, size_t len, int advice) {
              return madvise(addr, len, advice);
          }

          /* realpath$DARWIN_EXTSN: 若 iOS 无此符号版本则补 */
          char *realpath(const char *path, char *resolved);
          char *realpath$DARWIN_EXTSN(const char *path, char *resolved) __asm("_realpath$DARWIN_EXTSN");
          char *realpath$DARWIN_EXTSN(const char *path, char *resolved) {
              return realpath(path, resolved);
          }

          /* basename: GNU 语义（不修改输入） */
          char *basename(char *path) {
              if (path == 0 || *path == '\0') return (char *)".";
              size_t len = strlen(path);
              const char *end = path + len;
              while (end > path && end[-1] == '/') end--;
              if (end == path) return (char *)"/";
              const char *start = end;
              while (start > path && start[-1] != '/') start--;
              return (char *)start;
          }

          /* OpenSSL BIO recvmmsg/sendmmsg (Linux-only paths) + CRYPTO_strndup */
          int BIO_recvmmsg(void *fd, void *msgvec, unsigned int vlen, unsigned int flags, void *timeout) {
              (void)fd; (void)msgvec; (void)vlen; (void)flags; (void)timeout;
              errno = ENOSYS;
              return -1;
          }
          int BIO_sendmmsg(void *fd, void *msgvec, unsigned int vlen, unsigned int flags) {
              (void)fd; (void)msgvec; (void)vlen; (void)flags;
              errno = ENOSYS;
              return -1;
          }
          void *CRYPTO_strndup(const char *str, size_t s) {
              return strndup(str, s);
          }
          STUB_EOF
          cp Build/native/i4/objects/posix_stub.c Build/native/i5/objects/posix_stub.c
          xcrun -sdk iphoneos clang -arch arm64 -O2 -c Build/native/i4/objects/posix_stub.c -o Build/native/i4/objects/posix_stub.o
          xcrun -sdk iphoneos clang -arch arm64 -O2 -c Build/native/i5/objects/posix_stub.c -o Build/native/i5/objects/posix_stub.o
          # 注入 link argv：text_provider / v8 / engine 的 link 任务加上 stub.o
          python3 - <<'PY_EOF'
          import json
          plan_path = 'native-build-plan.json'
          plan = json.load(open(plan_path, encoding='utf-8'))
          patched = []
          for item in plan['jobs']:
              if item.get('kind') != 'link':
                  continue
              out = item.get('output', '')
              if not (out.endswith('/text_provider.framework/text_provider')
                      or out.endswith('/v8.framework/v8')
                      or out.endswith('/engine.framework/engine')):
                  continue
              level = 'i5' if '/i5/' in out else 'i4'
              stub = '$ROOT/Build/native/%s/objects/posix_stub.o' % level
              argv = item['argv']
              if stub in argv:
                  continue
              for i, a in enumerate(argv):
                  if a.endswith('.o') and '$ROOT' in a and 'objects/' in a:
                      argv.insert(i + 1, stub)
                      patched.append((out.split('Frameworks/')[-1], stub))
                      break
          json.dump(plan, open(plan_path, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          print('patched links:')
          for o, s in patched:
              print('  ', o, '->', s)
          print('total:', len(patched))
          PY_EOF
          echo "=== POSIX stub patch verification ==="
          echo "posix_stub.o references in plan:"
          grep -n "posix_stub.o" native-build-plan.json | head -n 8
          echo "stub object files:"
          ls -la Build/native/i4/objects/posix_stub.o Build/native/i5/objects/posix_stub.o
          echo "=================================================="

      - name: Compile Metal shader libraries and matching manifest
        run: |
          set -o pipefail
          mkdir -p Build
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent metalToolchain
            xcrun --kill-cache
          fi
          xcrun --sdk iphoneos metal --version
          python3 scripts/build_data.py shaders --jobs 2 2>&1 | tee Build/shader-build.log

      - name: Build native frameworks and export matching IPA
        run: |
          set -o pipefail
          ./icsm build --unsigned --bundle-id "$ICSM_BUNDLE_ID" --jobs "$ICSM_BUILD_JOBS" 2>&1 | tee Build/cloud-build.log
          python3 scripts/verify_ipa.py Build/iCSM-unsigned.ipa --unsigned --data-manifest Build/data/distribution-assets.json --report Build/ipa-report.json

      - name: Transfer app and compiled shaders to data job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iCSM-full-build-intermediate
          path: |
            Build/iCSM-unsigned.ipa
            Build/iCSM.entitlements
            Build/ipa-report.json
            Build/data/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iCSM-full-build-log
          path: Build/*.log
          if-no-files-found: ignore
          retention-days: 7

  data:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out data builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download matching app and Metal libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iCSM-full-build-intermediate
          path: Build

      - name: Stream resource inputs from GitHub and assemble data
        env:
          GH_TOKEN: ${{ secrets.DATA_RELEASE_TOKEN || github.token }}
          ICSM_DATA_REPOSITORY: ${{ inputs.data_repository }}
        run: |
          set -o pipefail
          df -h .
          python3 scripts/build_data.py package --repository "$ICSM_DATA_REPOSITORY" 2>&1 | tee Build/data-package.log

      - name: Publish paired IPA and data volumes on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_full_build.py

      - name: Upload data job log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iCSM-data-build-log
          path: Build/data-package.log
          if-no-files-found: ignore
          retention-days: 7
